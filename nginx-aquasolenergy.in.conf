# ==============================================================================
# Nginx Configuration for Aqua-Sol Energy (https://aquasolenergy.in)
# Place this file in: /etc/nginx/sites-available/aquasolenergy.in
# Enable with: ln -s /etc/nginx/sites-available/aquasolenergy.in /etc/nginx/sites-enabled/
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name aquasolenergy.in www.aquasolenergy.in;

    # Allow Let's Encrypt Certbot SSL verification challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aquasolenergy.in www.aquasolenergy.in;

    # SSL Certificates (Managed via Certbot)
    # Run: certbot --nginx -d aquasolenergy.in -d www.aquasolenergy.in
    ssl_certificate /etc/letsencrypt/live/aquasolenergy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aquasolenergy.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend Static Build Root Directory
    root /var/www/AquaSol/frontend/dist;
    index index.html;

    # Client Body Limit for Media / Image Uploads
    client_max_body_size 15M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for Ultra-Fast Page Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Frontend React SPA Routing (Serves index.html on dynamic routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Static Asset Caching (JS, CSS, Images, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.html;
    }

    # 3. Backend API Proxy (Forward to Node.js Backend on Port 5111)
    location /api/ {
        proxy_pass http://127.0.0.1:5111/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # 4. Uploaded Files Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:5111/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
